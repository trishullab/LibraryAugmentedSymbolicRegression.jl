# Environment for the runnable examples. The package pins SymbolicRegression to a
# git rev (its own [sources]); mirror that here so `--project=examples` resolves the
# same SR the package builds against. Instantiate once with:
#   julia --project=examples -e 'using Pkg; Pkg.instantiate()'
[deps]
LibraryAugmentedSymbolicRegression = "158930c3-947c-4174-974b-74b39e64a28f"
MLJ = "add582a8-e3ab-11e8-2d5e-e98b27df1bc7"
SymbolicRegression = "8254be44-1295-4e6a-a16d-46603ac705cb"

[sources]
LibraryAugmentedSymbolicRegression = { path = ".." }
SymbolicRegression = { url = "https://github.com/MilesCranmer/SymbolicRegression.jl.git", rev = "v2.0.0-beta.2" }
